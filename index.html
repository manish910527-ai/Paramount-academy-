<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paramount Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --success: #22c55e; --danger: #ef4444; --review: #facc15; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 30px; user-select: none; }
        
        header { background: white; color: var(--primary); padding: 10px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-bottom: 3px solid var(--primary); }
        .logo-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 5px; }
        header h1 { margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase; color: #1e3a8a; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* Screens */
        #login-screen, #dashboard-screen, #quiz-screen, #result-screen { display: none; }

        /* --- LOADING SCREEN (NEW) --- */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            border: 5px solid #f3f3f3; border-top: 5px solid var(--primary);
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-weight: bold; color: var(--primary); font-size: 18px; }

        /* Cards & Inputs */
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        input { width: 85%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 5px; font-size: 15px; }

        /* CLEAN DASHBOARD */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: white; padding: 10px; border-radius: 10px; }
        .flt-card { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; cursor: pointer; text-align: center; }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .sub-card { background: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid #ddd; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        .sub-card:active { transform: scale(0.95); background: #eff6ff; }

        /* TEST SELECTOR MODAL */
        #test-selector-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; width: 85%; max-width: 400px; padding: 20px; border-radius: 15px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popUp 0.3s ease;
        }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #374151; }
        .test-list-btn {
            display: block; width: 100%; padding: 12px; margin: 8px 0; background: #f3f4f6;
            border: 1px solid #ddd; border-radius: 8px; text-align: left; cursor: pointer; font-weight: 600;
        }
        .test-list-btn:hover { background: #dbeafe; border-color: var(--primary); color: var(--primary); }
        .close-modal { margin-top: 10px; background: #ef4444; color: white; padding: 8px 20px; border: none; border-radius: 20px; cursor: pointer; }

        /* Quiz Layout */
        .timer-bar { background: #1f2937; color: white; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .palette-area { background: white; padding: 10px; border-radius: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap: 6px; max-height: 150px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #ddd; }
        .q-num { width: 35px; height: 35px; border-radius: 5px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; background: #eee; }
        .q-num.current { border: 2px solid var(--primary); transform: scale(1.1); font-weight: bold; }
        .q-num.answered { background: var(--success); color: white; border: none; }
        .q-num.skipped { background: var(--danger); color: white; border: none; }
        .q-num.reviewed { background: var(--review); color: black; border: none; }
        .question-area { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; min-height: 180px; }
        .opt-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; text-align: left; background: white; cursor: pointer; font-size: 15px; }
        .opt-btn.selected { background: #dbeafe; border-color: var(--primary); font-weight: bold; }
        .nav-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-review { background: var(--review); color: black; }
        .btn-prev { background: #6b7280; }
        .review-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #ddd; }
        .review-card.correct { border-left-color: var(--success); }
        .review-card.wrong { border-left-color: var(--danger); }
        .expl-box { background: #fffbeb; padding: 10px; border-radius: 5px; margin-top: 10px; font-size: 13px; border: 1px solid #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Questions Load Ho Rahe Hain...</div>
    </div>

    <header>
        <img src="logo.png" alt="Paramount" class="logo-img">
        <h1>Paramount Academy</h1>
    </header>

    <div class="container">
        <div id="login-screen">
            <div class="card" style="text-align:center;">
                <h2>Student Login</h2>
                <input type="text" id="student-name" placeholder="Apna Naam Dalein">
                <button class="btn-main" onclick="login()">Enter Dashboard</button>
            </div>
        </div>

        <div id="dashboard-screen">
            <div class="top-bar">
                <div>👋 Hello, <b id="display-name">Student</b></div>
                <button onclick="logout()" style="color:red; border:none; background:none; font-weight:bold;">Logout</button>
            </div>
            
            <div class="card flt-card" onclick="openTestSelector('FLT', 120)">
                <h2 style="margin:0;">🏆 Full Length Tests</h2>
                <p>Click to Select Test</p>
            </div>

            <h3 style="margin-top:20px; color:#374151;">📚 Sectional Tests</h3>
            <div class="subject-grid">
                <div class="sub-card" style="border-color:#ef4444;" onclick="openTestSelector('Maths', 30)">Maths</div>
                <div class="sub-card" style="border-color:#9333ea;" onclick="openTestSelector('Reasoning', 30)">Reasoning</div>
                <div class="sub-card" style="border-color:#f59e0b;" onclick="openTestSelector('GK', 15)">GK / GS</div>
                <div class="sub-card" style="border-color:#10b981;" onclick="openTestSelector('Science', 15)">Science</div>
            </div>
        </div>

        <div id="test-selector-modal">
            <div class="modal-content">
                <div class="modal-title" id="modal-subject-title">Select Test</div>
                <div id="test-list-container"></div>
                <button class="close-modal" onclick="closeTestSelector()">Close</button>
            </div>
        </div>

        <div id="quiz-screen">
            <div class="timer-bar">
                <span id="subject-label">Test</span>
                <span id="time-left">00:00</span>
            </div>
            <div class="palette-area" id="q-palette"></div>
            <div class="question-area">
                <div id="q-text" style="font-weight:600; font-size:17px; margin-bottom:15px; line-height: 1.5;">Question Loading...</div>
                <div id="q-options"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-main btn-prev" onclick="prevQuestion()">⬅ Back</button>
                <button class="btn-main" onclick="nextQuestion()">Next ➡</button>
                <button class="btn-main btn-review" onclick="markReview()">⭐ Review</button>
                <button class="btn-main" style="background:#1f2937;" onclick="confirmSubmit()">Finish Test</button>
            </div>
        </div>

        <div id="result-screen">
            <div class="card" style="text-align:center;">
                <h2 id="final-score" style="color:var(--primary); font-size:32px;">0 / 0</h2>
                <button class="btn-main" style="background:#9333ea; margin-bottom:10px;" onclick="window.open('https://forms.gle/6sgNBohDaiY2TroSA')">📤 Submit Score to Admin</button>
                <button class="btn-main" onclick="location.reload()">🏠 Go Home</button>
            </div>
            <h3>Answer Key & Solutions</h3>
            <div id="review-box"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
